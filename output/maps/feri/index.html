<!doctype html><html><head><meta charset="utf-8"><style>body{margin:0;font-family:var(--font-sans,system-ui);color:var(--foreground,#ddd)}img{display:block;width:100%;max-height:570px;object-fit:contain;border-radius:8px}nav{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}button{font:inherit;padding:8px 12px;border:1px solid var(--border,#555);border-radius:6px;background:var(--secondary,#333);color:inherit;cursor:pointer}button[aria-pressed=true]{background:#40523c;color:#edf2e3}p{font-size:14px;color:var(--muted-foreground,#aaa);margin:8px 0}</style></head><body><img id="view" src="Previews/01-overview.png" alt="FERI first-pass map overview"><nav aria-label="Map preview"><button aria-pressed="true" data-image="01-overview">Overview</button><button aria-pressed="false" data-image="02-classroom">Classroom</button><button aria-pressed="false" data-image="03-courtyard">Courtyard</button><button aria-pressed="false" data-image="04-service">Service route</button></nav><p>FERI · First environment pass · SVG layout and combat pockets · Green fluorescent palette</p><script>const shots={"01-overview":"Previews/01-overview.png","02-classroom":"Previews/02-classroom.png","03-courtyard":"Previews/03-courtyard.png","04-service":"Previews/04-service.png"};document.querySelectorAll('button').forEach(b=>b.onclick=()=>{document.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));document.getElementById('view').src=shots[b.dataset.image];document.getElementById('view').alt='FERI '+b.textContent+' preview';});</script></body></html>
