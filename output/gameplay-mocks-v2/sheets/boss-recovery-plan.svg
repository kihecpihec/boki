<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1430" viewBox="0 0 1600 1430" role="img" aria-labelledby="title"><title id="title">Professor arena with two equivalent rechargeable battery locations</title><rect width="1600" height="1430" fill="#090e14"/><text x="60" y="65" fill="#d0ef75" font-size="20" font-weight="400" font-family="monospace">BOKI / GAMEPLAY MOCKS V2 / ONE SHARED CLASSROOM</text><text x="60" y="130" fill="#d9e1cf" font-size="42" font-weight="700" font-family="monospace">THE DEADLINE / RECOVERY INSIDE THE SEAL</text><text x="60" y="185" fill="#a3b4b6" font-size="20" font-weight="400" font-family="monospace">Meter-scaled proposal / same 24 × 20 m room and 14 × 12 m central clear floor.</text><text x="60" y="215" fill="#a3b4b6" font-size="20" font-weight="400" font-family="monospace">Charges are on opposite riding lanes, reachable at zero battery; furniture stays outside them.</text><rect x="100" y="340" width="768" height="640" fill="#121c24" stroke="#628d9f" stroke-width="2"/><rect x="260" y="468" width="448" height="384" fill="#23393c" stroke="#d0ef75" stroke-width="2" stroke-dasharray="8 6"/><text x="95" y="320" fill="#a3b4b6" font-size="18" font-weight="400" font-family="monospace">0</text><text x="223" y="320" fill="#a3b4b6" font-size="18" font-weight="400" font-family="monospace">4</text><text x="351" y="320" fill="#a3b4b6" font-size="18" font-weight="400" font-family="monospace">8</text><text x="479" y="320" fill="#a3b4b6" font-size="18" font-weight="400" font-family="monospace">12</text><text x="607" y="320" fill="#a3b4b6" font-size="18" font-weight="400" font-family="monospace">16</text><text x="735" y="320" fill="#a3b4b6" font-size="18" font-weight="400" font-family="monospace">20</text><text x="863" y="320" fill="#a3b4b6" font-size="18" font-weight="400" font-family="monospace">24</text><text x="324" y="660" fill="#d0ef75" font-size="22" font-weight="400" font-family="monospace">CLEAR DODGE FLOOR</text><rect x="452" y="404" width="64" height="32" fill="#6e5741" stroke="#d9e1cf" stroke-width="2"/><text x="356" y="372" fill="#d9e1cf" font-size="20" font-weight="400" font-family="monospace">PROFESSOR / 4000 HP</text><rect x="214" y="706" width="28" height="36" fill="#d0ef75" stroke="#d0ef75" stroke-width="2"/><text x="221" y="731" fill="#090e14" font-size="22" font-weight="700" font-family="monospace">+</text><text x="248" y="731" fill="#d0ef75" font-size="16" font-weight="400" font-family="monospace">B1</text><rect x="726" y="706" width="28" height="36" fill="#d0ef75" stroke="#d0ef75" stroke-width="2"/><text x="733" y="731" fill="#090e14" font-size="22" font-weight="700" font-family="monospace">+</text><text x="760" y="731" fill="#d0ef75" font-size="16" font-weight="400" font-family="monospace">B2</text><path d="M445.6 980 L522.4 980" stroke="#ef624a" stroke-width="12" fill="none"/><text x="260" y="1044" fill="#ef624a" font-size="22" font-weight="400" font-family="monospace">SOLID ENTRY SEAL / closes on entry</text><text x="970" y="365" fill="#a3b4b6" font-size="20" font-weight="400" font-family="monospace">B1 / B2: equivalent +25 charges</text><text x="970" y="395" fill="#a3b4b6" font-size="20" font-weight="400" font-family="monospace">Initially charged; 20 active seconds</text><text x="970" y="425" fill="#a3b4b6" font-size="20" font-weight="400" font-family="monospace">to recharge after collection.</text><text x="970" y="455" fill="#a3b4b6" font-size="20" font-weight="400" font-family="monospace">Leave available when battery is full.</text><text x="970" y="485" fill="#a3b4b6" font-size="20" font-weight="400" font-family="monospace"></text><text x="970" y="515" fill="#a3b4b6" font-size="20" font-weight="400" font-family="monospace">Guilt: decorative shadow only.</text><text x="970" y="545" fill="#a3b4b6" font-size="20" font-weight="400" font-family="monospace">No ambient chase or replenishment.</text><text x="970" y="575" fill="#a3b4b6" font-size="20" font-weight="400" font-family="monospace">Approach encounters deactivate.</text><text x="970" y="605" fill="#a3b4b6" font-size="20" font-weight="400" font-family="monospace">Approach rendering is suppressed.</text><text x="970" y="635" fill="#a3b4b6" font-size="20" font-weight="400" font-family="monospace"></text><text x="970" y="665" fill="#a3b4b6" font-size="20" font-weight="400" font-family="monospace">Exam Barrage: 3 slow papers.</text><text x="970" y="695" fill="#a3b4b6" font-size="20" font-weight="400" font-family="monospace">Deadline Slam: 0.8 s warning.</text><text x="970" y="725" fill="#a3b4b6" font-size="20" font-weight="400" font-family="monospace">FERI B: two melee once at 50% HP.</text><text x="970" y="755" fill="#a3b4b6" font-size="20" font-weight="400" font-family="monospace">FERI C + POWER OFF: 3400 HP.</text><text x="970" y="785" fill="#a3b4b6" font-size="20" font-weight="400" font-family="monospace">No panel use: standard 4000 HP.</text><text x="100" y="1150" fill="#a3b4b6" font-size="22" font-weight="400" font-family="monospace">Furniture, ring radius and collision must preserve both charge approaches.</text><text x="100" y="1180" fill="#a3b4b6" font-size="22" font-weight="400" font-family="monospace">Battery drain continues during boss gameplay; pause freezes drain and recharge.</text><text x="100" y="1210" fill="#a3b4b6" font-size="22" font-weight="400" font-family="monospace">The arena door is a commitment. No return to approach routes for recovery.</text><text x="100" y="1240" fill="#a3b4b6" font-size="22" font-weight="400" font-family="monospace">All FERI routes reach this same arena. Guilt gains no second boss AI.</text><text x="100" y="1270" fill="#a3b4b6" font-size="22" font-weight="400" font-family="monospace"></text><text x="100" y="1300" fill="#a3b4b6" font-size="22" font-weight="400" font-family="monospace">Placement and dimensions are authoring proposals. Attack and pickup rules: Gameplay.md §5 / Story.md §§3–5.</text></svg>