ont-size="19" fill="#090E14" font-family="Menlo,monospace" font-weight="400">B2</text><circle cx="710" cy="1100" r="25" fill="#628D9F"/><text x="693" y="1107" font-size="19" fill="#090E14" font-family="Menlo,monospace" font-weight="400">B3</text><circle cx="1330" cy="680" r="25" fill="#BA86EA"/><text x="1313" y="687" font-size="19" fill="#090E14" font-family="Menlo,monospace" font-weight="400">C1</text><circle cx="1330" cy="920" r="25" fill="#BA86EA"/><text x="1313" y="927" font-size="19" fill="#090E14" font-family="Menlo,monospace" font-weight="400">C2</text><circle cx="1330" cy="1180" r="25" fill="#BA86EA"/><text x="1313" y="1187" font-size="19" fill="#090E14" font-family="Menlo,monospace" font-weight="400">C3</text><text x="100" y="1345" font-size="18" fill="#8B9D9E" font-family="Menlo,monospace" font-weight="400">A / more open combat</text><text x="650" y="1345" font-size="18" fill="#8B9D9E" font-family="Menlo,monospace" font-weight="400">B / movement or ranged</text><text x="1120" y="1345" font-size="18" fill="#8B9D9E" font-family="Menlo,monospace" font-weight="400">C / short secret variant</text><text x="1670" y="280" font-size="34" fill="#D0EF75" font-family="Avenir Next Condensed,Arial" font-weight="800">A / Gozdna strmina</text><text x="1670" y="335" font-size="22" fill="#D9E1CF" font-family="Menlo,monospace" font-weight="400">A1 · spruce slalom</text><text x="1670" y="381" font-size="22" fill="#D9E1CF" font-family="Menlo,monospace" font-weight="400">A2 · melee clearing / XP</text><text x="1670" y="427" font-size="22" fill="#D9E1CF" font-family="Menlo,monospace" font-weight="400">A3 · Guilt behind player</text><text x="1670" y="511" font-size="34" fill="#628D9F" font-family="Avenir Next Condensed,Arial" font-weight="800">B / Gondola service path</text><text x="1670" y="566" font-size="22" fill="#D9E1CF" font-family="Menlo,monospace" font-weight="400">B1 · maintenance wreckage</text><text x="1670" y="612" font-size="22" fill="#D9E1CF" font-family="Menlo,mono