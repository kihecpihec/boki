,monospace" font-weight="400">8 regular enemies max · exit persists Forest C for next run · start watch 07:58</text><text x="64" y="1970" font-size="22" fill="#8B9D9E" font-family="Menlo,monospace" font-weight="400">C requires its saved unlock at run start. Current-run discoveries do not open gates. No cross-branch shortcuts.</text><text x="64" y="2025" font-size="21" fill="#8B9D9E" font-family="Menlo,monospace" font-weight="400">Canonical rules: docs/Gameplay.md §§2–4. Build to tested module sizes; do not measure these topology-unit paths.</text></svg>