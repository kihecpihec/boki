ill="#090E14" font-family="Menlo,monospace" font-weight="400">B2</text><circle cx="710" cy="1100" r="25" fill="#628D9F"/><text x="693" y="1107" font-size="19" fill="#090E14" font-family="Menlo,monospace" font-weight="400">B3</text><circle cx="1330" cy="680" r="25" fill="#BA86EA"/><text x="1313" y="687" font-size="19" fill="#090E14" font-family="Menlo,monospace" font-weight="400">C1</text><circle cx="1330" cy="920" r="25" fill="#BA86EA"/><text x="1313" y="927" font-size="19" fill="#090E14" font-family="Menlo,monospace" font-weight="400">C2</text><circle cx="1330" cy="1180" r="25" fill="#BA86EA"/><text x="1313" y="1187" font-size="19" fill="#090E14" font-family="Menlo,monospace" font-weight="400">C3</text><text x="100" y="1345" font-size="18" fill="#8B9D9E" font-family="Menlo,monospace" font-weight="400">A / more open combat</text><text x="650" y="1345" font-size="18" fill="#8B9D9E" font-family="Menlo,monospace" font-weight="400">B / movement or ranged</text><text x="1120" y="1345" font-size="18" fill="#8B9D9E" font-family="Menlo,monospace" font-weight="400">C / short secret variant</text><text x="1670" y="280" font-size="34" fill="#D0EF75" font-family="Avenir Next Condensed,Arial" font-weight="800">A / Glavni vhod</text><text x="1670" y="335" font-size="22" fill="#D9E1CF" font-family="Menlo,monospace" font-weight="400">A1 · repeated corridor</text><text x="1670" y="381" font-size="22" fill="#D9E1CF" font-family="Menlo,monospace" font-weight="400">A2 · melee group 1</text><text x="1670" y="427" font-size="22" fill="#D9E1CF" font-family="Menlo,monospace" font-weight="400">A3 · melee group 2</text><text x="1670" y="511" font-size="34" fill="#628D9F" font-family="Avenir Next Condensed,Arial" font-weight="800">B / Dvorišče</text><text x="1670" y="566" font-size="22" fill="#D9E1CF" font-family="Menlo,monospace" font-weight="400">B1 · courtyard ambush</text><text x="1670" y="612" font-size="22" fill="#D9E1CF" font-family="Menlo,monospace" font-weight="400">B2 · continuous ramp</text><text x="1670" y="658" font-size="22" fill="#D9E1CF" font-family="Menlo,monospace" font-weight="400">B3 · side corridor</text><text x="1670" y="742" font-size="34" fill="#BA86EA" font-family="Avenir Next Condensed,Arial" font-weight="800">C / Servisni vhod</text><text x="1670" y="797" font-size="22" fill="#D9E1CF" font-family="Menlo,monospace" font-weight="400">C1 · trap 1</text><text x="1670" y="843" font-size="22" fill="#D9E1CF" font-family="Menlo,monospace" font-weight="400">C2 · trap 2</text><text x="1670" y="889" font-size="22" fill="#D9E1CF" font-family="Menlo,monospace" font-weight="400">C3 · optional POWER OFF</text><text x="1670" y="973" font-size="21" fill="#8B9D9E" font-family="Menlo,monospace" font-weight="400">Colored lanes show identity only; access is</text><text x="1670" y="1005" font-size="21" fill="#8B9D9E" font-family="Menlo,monospace" font-weight="400">filtered by the run snapshot.</text><text x="1670" y="1055" font-size="21" fill="#8B9D9E" font-family="Menlo,monospace" font-weight="400">Markers are proposed set-piece locations, not</text><text x="1670" y="1087" font-size="21" fill="#8B9D9E" font-family="Menlo,monospace" font-weight="400">fixed spawn quantities.</text><text x="1670" y="1137" font-size="21" fill="#8B9D9E" font-family="Menlo,monospace" font-weight="400">Use simple high banks/walls to prevent route</text><text x="1670" y="1169" font-size="21" fill="#8B9D9E" font-family="Menlo,monospace" font-weight="400">bypass; short rail art alone is not a secure lock.</text><line x1="800" y1="1495" x2="800" y2="1630" stroke="#D0EF75" stroke-width="6"/><rect x="520" y="1630" width="560" height="170" fill="#121C24"/><text x="545" y="1690" font-size="36" fill="#D9E1CF" font-family="Avenir Next Condensed,Arial" font-weight="800">ONE PROFESSOR CLASSROOM</text><text x="545" y="1745" font-size="23" fill="#8B9D9E" font-family="Menlo,monospace" font-weight="400">B adds / C panel modifier</text><text x="64" y="1910" font-size="24" fill="#D0EF75" font-family="Menlo,monospace" font-weight="400">8 regular enemies + boss · arena entry persists FERI C next run · one classroom only</text><text x="64" y="1970" font-size="22" fill="#8B9D9E" font-family="Menlo,monospace" font-weight="400">C requires its saved unlock at run start. Current-run discoveries do not open gates. No cross-branch shortcuts.</text><text x="64" y="2025" font-size="21" fill="#8B9D9E" font-family="Menlo,monospace" font-weight="400">Canonical rules: docs/Gameplay.md §§2–4. Build to tested module sizes; do not measure these topology-unit paths.</text></svg>