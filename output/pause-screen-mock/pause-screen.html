<!doctype html><html lang="en"><head><meta charset="utf-8"><title>BOKI / Pause screen (UI only)</title>
<!-- UI-only layer: transparent background. The live game state renders underneath.
     Add ?bg to the URL to preview over the start-screen reference image. -->
<style>
*{box-sizing:border-box;margin:0}
html,body{background:transparent}
body{font:22px/1.4 "Courier New",Consolas,monospace;color:#e8e4dc}
.screen{position:relative;width:1600px;height:900px;overflow:hidden;background:transparent;transform-origin:0 0}
.bg{position:absolute;inset:0;background:url(../start-screen-mock/ref/background.png) center/cover no-repeat;image-rendering:pixelated;display:none}
.preview .bg{display:block}
/* preview only: hides the HUD baked into the reference screenshot (same as start-screen-mock) */
.mask{position:absolute;inset:0;display:none;background:
 linear-gradient(180deg,#05060aff 0,#05060aee 8%,#05060a00 20%),
 linear-gradient(0deg,#05060aff 0,#05060aff 17%,#05060a00 36%)}
.preview .mask{display:block}
/* pause dimming: darkens the game, heavier on the left where the menu sits */
.vig{position:absolute;inset:0;background:radial-gradient(ellipse at 60% 50%,#0000 40%,#000a 100%),linear-gradient(90deg,#000c 0,#0000 55%),linear-gradient(#0006,#0006)}
.red{position:absolute;inset:0;box-shadow:inset 0 0 220px 40px #7a0b10aa;pointer-events:none}
.scan{position:absolute;inset:0;background:repeating-linear-gradient(0deg,#0000 0 2px,#0004 2px 3px);pointer-events:none}
.noise{position:absolute;inset:0;opacity:.07;background:repeating-conic-gradient(#fff 0 25%,#000 0 50%) 0 0/4px 4px;mix-blend-mode:overlay}
.tl,.tr{position:absolute;top:34px;font-size:26px;letter-spacing:.08em;text-shadow:0 0 8px #000}
.tl{left:46px}.tr{right:46px}
.title{position:absolute;left:46px;top:150px;font:700 150px/1 "Courier New",monospace;letter-spacing:.06em;color:#e8e4dc;
 text-shadow:-6px 0 #ff2a3a99,6px 0 #2affd566,0 0 50px #000}
.title::after{content:"";position:absolute;left:0;right:0;top:66px;height:10px;background:#05060a;opacity:.55;transform:translateX(14px)}
.sub{position:absolute;left:52px;top:310px;text-shadow:0 0 8px #000,0 0 18px #000;font-size:24px;color:#bdb8ae;letter-spacing:.06em}
.sub i{font-style:normal;color:#c4202a}
.menu{position:absolute;left:46px;bottom:52px;font-size:30px;line-height:1.7;letter-spacing:.08em;text-shadow:0 0 8px #000}
.menu div{color:#8c8880;padding-left:2ch}
.menu .sel{color:#e8e4dc;padding-left:0}
.menu .sel::before{content:"> ";color:#c4202a}
.menu .sel::after{content:"_";animation:b 1s steps(1) infinite}
@keyframes b{50%{opacity:0}}
/* run status card, same frame language as the level-up option cards */
.run{position:absolute;left:1030px;top:150px;width:520px;padding:20px 26px;background:#0b0808d9;border:2px solid #3a3030;border-left:6px solid #9b1c1c}
.run h2{font:700 24px/1 "Courier New",monospace;letter-spacing:.2em;color:#bdb8ae;margin-bottom:16px}
.row{display:flex;justify-content:space-between;align-items:center;font-size:20px;color:#a49a88;margin-top:10px;letter-spacing:.06em}
.row b{font-weight:400;color:#e8e4dc}
.row .meter{flex:1;height:12px;margin:0 14px;background:#1a1414;border:1px solid #3a3030}
.row .meter i{display:block;height:100%}
.hp i{background:#c4202a}.bat i{background:#b9c27a}.xp i{background:#8a8070}
.ups{margin-top:18px;padding-top:14px;border-top:1px solid #3a3030;font-size:17px;color:#6b6258;letter-spacing:.08em}
.ups span{display:block;margin-top:6px;color:#a49a88;font-size:19px}
.ups em{font-style:normal;color:#c4202a}
.hint{position:absolute;right:46px;bottom:52px;font-size:24px;letter-spacing:.08em;text-align:right;color:#bdb8ae;text-shadow:0 0 8px #000}
.hint small{display:block;font-size:17px;color:#7d7a74;margin-top:4px}
</style></head><body>
<div class="screen" id="s">
 <div class="bg"></div><div class="mask"></div><div class="vig"></div><div class="red"></div>
 <div class="tl">PAUSED</div><div class="tr">07:58</div>
 <div class="title">BOKI</div>
 <div class="sub">THE WORLD WAITS. <i>IT WON'T FOR LONG.</i></div>
 <div class="run">
  <h2>RUN</h2>
  <div class="row hp">HP<span class="meter"><i style="width:80%"></i></span><b>80/100</b></div>
  <div class="row bat">BATTERY<span class="meter"><i style="width:64%"></i></span><b>64%</b></div>
  <div class="row xp">XP<span class="meter"><i style="width:55%"></i></span><b>LV 2/6</b></div>
  <div class="ups">UPGRADES
   <span>Rave Overdrive <em>×1</em></span>
   <span>Turbo Skiro <em>×1</em></span>
  </div>
 </div>
 <div class="menu"><div class="sel">RESUME</div><div>SETTINGS</div><div>RESTART RUN</div><div>QUIT TO MENU</div></div>
 <div class="hint">ENTER: SELECT<small>W/S SELECT &nbsp; ESC RESUME</small></div>
 <div class="noise"></div><div class="scan"></div>
</div>
<script>
if(location.search.indexOf('bg')>-1)document.getElementById('s').classList.add('preview');
function fit(){var s=document.getElementById('s'),k=Math.min(1,innerWidth/1600);s.style.transform='scale('+k+')';document.body.style.height=900*k+'px';document.body.style.overflow='hidden'}
fit();addEventListener('resize',fit);
</script>
</body></html>
