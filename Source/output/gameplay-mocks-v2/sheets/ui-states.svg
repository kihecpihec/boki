<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1730" viewBox="0 0 1600 1730" role="img" aria-labelledby="title"><title id="title">BOKI HUD, upgrade, battery and Guilt presentation states</title><rect width="1600" height="1730" fill="#090e14"/><text x="60" y="65" fill="#d0ef75" font-size="20" font-weight="400" font-family="monospace">BOKI / LOCAL UI MOCKS / STATIC PRESENTATION STATES</text><text x="60" y="130" fill="#d9e1cf" font-size="44" font-weight="700" font-family="monospace">FIGHT FOR XP. RIDE TO RECHARGE.</text><text x="60" y="185" fill="#a3b4b6" font-size="20" font-weight="400" font-family="monospace">Regular kill -&gt; XP pack + kill count. Fixed arena charge -&gt; +25 battery.</text><text x="60" y="215" fill="#a3b4b6" font-size="20" font-weight="400" font-family="monospace">No kill battery reward. Canonical rules: Gameplay §5 / Story §5. No gameplay code here.</text><rect x="60" y="290" width="480" height="255" fill="#121c24" stroke="#d0ef75" stroke-width="2"/><text x="80" y="326" fill="#d0ef75" font-size="17" font-weight="400" font-family="monospace">HUD / ACTIVE COMBAT</text><text x="80" y="382" fill="#d0ef75" font-size="25" font-weight="700" font-family="monospace">LIGHT 42 / 100</text><text x="80" y="435" fill="#d9e1cf" font-size="17" font-weight="400" font-family="monospace">XP 11 / 12</text><text x="80" y="467" fill="#d9e1cf" font-size="17" font-weight="400" font-family="monospace">SELECTIONS 2 / 6</text><text x="80" y="499" fill="#d9e1cf" font-size="17" font-weight="400" font-family="monospace">Exit open; stay for more XP.</text><rect x="560" y="290" width="480" height="255" fill="#121c24" stroke="#ba86ea" stroke-width="2"/><text x="580" y="326" fill="#ba86ea" font-size="17" font-weight="400" font-family="monospace">BOOST / PANIC MODE OWNED</text><text x="580" y="382" fill="#ba86ea" font-size="25" font-weight="700" font-family="monospace">PANIC READY</text><text x="580" y="435" fill="#d9e1cf" font-size="17" font-weight="400" font-family="monospace">Active chase within 10 m.</text><text x="580" y="467" fill="#d9e1cf" font-size="17" font-weight="400" font-family="monospace">+25% boost speed; +50% duration.</text><text x="580" y="499" fill="#d9e1cf" font-size="17" font-weight="400" font-family="monospace">Snapshot at start; normal cooldown.</text><rect x="1060" y="290" width="480" height="255" fill="#121c24" stroke="#ba86ea" stroke-width="2"/><text x="1080" y="326" fill="#ba86ea" font-size="17" font-weight="400" font-family="monospace">XP / SIX SELECTIONS</text><text x="1080" y="382" fill="#ba86ea" font-size="25" font-weight="700" font-family="monospace">MAX LEVEL</text><text x="1080" y="435" fill="#d9e1cf" font-size="17" font-weight="400" font-family="monospace">No XP drops or leftover collection.</text><text x="1080" y="467" fill="#d9e1cf" font-size="17" font-weight="400" font-family="monospace">Kills still count.</text><text x="1080" y="499" fill="#d9e1cf" font-size="17" font-weight="400" font-family="monospace">Keep battery recovery available.</text><rect x="60" y="580" width="480" height="255" fill="#121c24" stroke="#d0ef75" stroke-width="2"/><text x="80" y="616" fill="#d0ef75" font-size="17" font-weight="400" font-family="monospace">UPGRADE / 1 OF 3 TAKEN</text><text x="80" y="672" fill="#d0ef75" font-size="25" font-weight="700" font-family="monospace">RAVE OVERDRIVE</text><text x="80" y="725" fill="#d9e1cf" font-size="17" font-weight="400" font-family="monospace">+30% original base laser damage.</text><text x="80" y="757" fill="#d9e1cf" font-size="17" font-weight="400" font-family="monospace">Current +30% -&gt; new +60%.</text><text x="80" y="789" fill="#d9e1cf" font-size="17" font-weight="400" font-family="monospace">Capped at three selections.</text><rect x="560" y="580" width="480" height="255" fill="#121c24" stroke="#d0ef75" stroke-width="2"/><text x="580" y="616" fill="#d0ef75" font-size="17" font-weight="400" font-family="monospace">RECOVERY / BELOW CAPACITY</text><text x="580" y="672" fill="#d0ef75" font-size="25" font-weight="700" font-family="monospace">BATTERY CHARGE</text><text x="580" y="725" fill="#d9e1cf" font-size="17" font-weight="400" font-family="monospace">+25 current battery.</text><text x="580" y="757" fill="#d9e1cf" font-size="17" font-weight="400" font-family="monospace">Clamp to upgraded capacity.</text><text x="580" y="789" fill="#d9e1cf" font-size="17" font-weight="400" font-family="monospace">Consumes one of six selections.</text><rect x="1060" y="580" width="480" height="255" fill="#121c24" stroke="#d0ef75" stroke-width="2"/><text x="1080" y="616" fill="#d0ef75" font-size="17" font-weight="400" font-family="monospace">RECOVERY / INJURED ONLY</text><text x="1080" y="672" fill="#d0ef75" font-size="25" font-weight="700" font-family="monospace">EMERGENCY SNACK</text><text x="1080" y="725" fill="#d9e1cf" font-size="17" font-weight="400" font-family="monospace">Restore 30 HP; clamp to max.</text><text x="1080" y="757" fill="#d9e1cf" font-size="17" font-weight="400" font-family="monospace">Never duplicate this card.</text><text x="1080" y="789" fill="#d9e1cf" font-size="17" font-weight="400" font-family="monospace">Consumes one of six selections.</text><rect x="60" y="870" width="480" height="255" fill="#121c24" stroke="#d0ef75" stroke-width="2"/><text x="80" y="906" fill="#d0ef75" font-size="17" font-weight="400" font-family="monospace">CHARGE / AVAILABLE</text><text x="80" y="962" fill="#d0ef75" font-size="25" font-weight="700" font-family="monospace">RIDE THROUGH +25</text><text x="80" y="1015" fill="#d9e1cf" font-size="17" font-weight="400" font-family="monospace">Bright cell + battery silhouette.</text><text x="80" y="1047" fill="#d9e1cf" font-size="17" font-weight="400" font-family="monospace">Contact collects once.</text><text x="80" y="1079" fill="#d9e1cf" font-size="17" font-weight="400" font-family="monospace">At full battery: leave available.</text><rect x="560" y="870" width="480" height="255" fill="#121c24" stroke="#a3b4b6" stroke-width="2"/><text x="580" y="906" fill="#a3b4b6" font-size="17" font-weight="400" font-family="monospace">CHARGE / DEPLETED</text><text x="580" y="962" fill="#a3b4b6" font-size="25" font-weight="700" font-family="monospace">RECHARGING</text><text x="580" y="1015" fill="#d9e1cf" font-size="17" font-weight="400" font-family="monospace">Dark cell + broken outline.</text><text x="580" y="1047" fill="#d9e1cf" font-size="17" font-weight="400" font-family="monospace">20 active occupied-space seconds.</text><text x="580" y="1079" fill="#d9e1cf" font-size="17" font-weight="400" font-family="monospace">Pause/reentry retain remaining time.</text><rect x="1060" y="870" width="480" height="255" fill="#121c24" stroke="#d0ef75" stroke-width="2"/><text x="1080" y="906" fill="#d0ef75" font-size="17" font-weight="400" font-family="monospace">CHARGE / RETURN CUE</text><text x="1080" y="962" fill="#d0ef75" font-size="25" font-weight="700" font-family="monospace">CHARGE READY</text><text x="1080" y="1015" fill="#d9e1cf" font-size="17" font-weight="400" font-family="monospace">Short pulse + distinct sound.</text><text x="1080" y="1047" fill="#d9e1cf" font-size="17" font-weight="400" font-family="monospace">Return to available appearance.</text><text x="1080" y="1079" fill="#d9e1cf" font-size="17" font-weight="400" font-family="monospace">Silhouette stays readable on Low.</text><rect x="60" y="1160" width="480" height="255" fill="#121c24" stroke="#ef624a" stroke-width="2"/><text x="80" y="1196" fill="#ef624a" font-size="17" font-weight="400" font-family="monospace">GUILT / WARNING 1.5 s</text><text x="80" y="1252" fill="#ef624a" font-size="25" font-weight="700" font-family="monospace">DON’T LOOK BACK</text><text x="80" y="1305" fill="#d9e1cf" font-size="17" font-weight="400" font-family="monospace">Light flicker + heartbeat.</text><text x="80" y="1337" fill="#d9e1cf" font-size="17" font-weight="400" font-family="monospace">Scripted events suspend ambient.</text><text x="80" y="1369" fill="#d9e1cf" font-size="17" font-weight="400" font-family="monospace">Time drives escalation, not upgrades.</text><rect x="560" y="1160" width="480" height="255" fill="#121c24" stroke="#ef624a" stroke-width="2"/><text x="580" y="1196" fill="#ef624a" font-size="17" font-weight="400" font-family="monospace">GUILT / CHASE 6 s</text><text x="580" y="1252" fill="#ef624a" font-size="25" font-weight="700" font-family="monospace">KEEP MOVING.</text><text x="580" y="1305" fill="#d9e1cf" font-size="17" font-weight="400" font-family="monospace">Ordinary panic: +25% riding speed</text><text x="580" y="1337" fill="#d9e1cf" font-size="17" font-weight="400" font-family="monospace">for 2 s / 5 s cooldown.</text><text x="580" y="1369" fill="#d9e1cf" font-size="17" font-weight="400" font-family="monospace">Separate from Panic Mode boost.</text><rect x="1060" y="1160" width="480" height="255" fill="#121c24" stroke="#d0ef75" stroke-width="2"/><text x="1080" y="1196" fill="#d0ef75" font-size="17" font-weight="400" font-family="monospace">EXIT / NO KILL QUOTA</text><text x="1080" y="1252" fill="#d0ef75" font-size="25" font-weight="700" font-family="monospace">MOVE ON WHEN READY</text><text x="1080" y="1305" fill="#d9e1cf" font-size="17" font-weight="400" font-family="monospace">Leave without clearing a wave.</text><text x="1080" y="1337" fill="#d9e1cf" font-size="17" font-weight="400" font-family="monospace">City C still needs side-door escape.</text><text x="1080" y="1369" fill="#d9e1cf" font-size="17" font-weight="400" font-family="monospace">Boss entry commits; recovery inside.</text><text x="60" y="1500" fill="#d0ef75" font-size="21" font-weight="400" font-family="monospace">UPGRADE OFFER ROW: GAME PAUSED / CHOOSE EXACTLY ONE OF THREE DISTINCT ELIGIBLE OPTIONS</text><text x="60" y="1560" fill="#a3b4b6" font-size="20" font-weight="400" font-family="monospace">The row is one example offer, not the whole pool. XP thresholds: 3 / 7 / 12 / 18 / 25 / 33.</text><text x="60" y="1590" fill="#a3b4b6" font-size="20" font-weight="400" font-family="monospace">Full pool: Rave Overdrive, Turbo Skiro, Bigger Battery, Double Trouble, Panic Mode, Emergency Snack.</text><text x="60" y="1620" fill="#a3b4b6" font-size="20" font-weight="400" font-family="monospace">Remove capped/ineligible options. Recovery fallback cards consume a selection; resolve thresholds without unpausing.</text><text x="60" y="1650" fill="#a3b4b6" font-size="20" font-weight="400" font-family="monospace">See ui-states.html for full eligibility, base-percentage stacking and Bigger Battery charge-percentage preservation.</text></svg>