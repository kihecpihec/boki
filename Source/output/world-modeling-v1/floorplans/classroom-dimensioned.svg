<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="2400" height="1850" viewBox="0 0 2400 1850"><title>Dimensioned classroom proposal</title><rect x="0" y="0" width="2400" height="1640" fill="#090E14"/><text x="64" y="65" font-size="20" fill="#D0EF75" font-family="Menlo,monospace" font-weight="400">BOKI / ENTIRE-WORLD MODELING HANDOFF V1</text><text x="64" y="150" font-size="74" fill="#D9E1CF" font-family="Avenir Next Condensed,Arial" font-weight="800">ONE CLASSROOM / ONE CLEAR DODGE FLOOR</text><text x="64" y="205" font-size="22" fill="#8B9D9E" font-family="Menlo,monospace" font-weight="400">METER-SCALED PROPOSAL / room 24 × 20 m; clear center 14 × 12 m; validate in Unity</text><rect x="180" y="360" width="1200" height="1000" fill="#121C24" stroke="#D9E1CF" stroke-width="3"/><line x1="180" y1="360" x2="180" y2="1360" stroke="#263B49" stroke-width="1"/><text x="174" y="340" font-size="18" fill="#8B9D9E" font-family="Menlo,monospace" font-weight="400">0</text><line x1="380" y1="360" x2="380" y2="1360" stroke="#263B49" stroke-width="1"/><text x="374" y="340" font-size="18" fill="#8B9D9E" font-family="Menlo,monospace" font-weight="400">4</text><line x1="580" y1="360" x2="580" y2="1360" stroke="#263B49" stroke-width="1"/><text x="574" y="340" font-size="18" fill="#8B9D9E" font-family="Menlo,monospace" font-weight="400">8</text><line x1="780" y1="360" x2="780" y2="1360" stroke="#263B49" stroke-width="1"/><text x="774" y="340" font-size="18" fill="#8B9D9E" font-family="Menlo,monospace" font-weight="400">12</text><line x1="980" y1="360" x2="980" y2="1360" stroke="#263B49" stroke-width="1"/><text x="974" y="340" font-size="18" fill="#8B9D9E" font-family="Menlo,monospace" font-weight="400">16</text><line x1="1180" y1="360" x2="1180" y2="1360" stroke="#263B49" stroke-width="1"/><text x="1174" y="340" font-size="18" fill="#8B9D9E" font-family="Menlo,monospace" font-weight="400">20</text><line x1="1380" y1="360" x2="1380" y2="1360" stroke="#263B49" stroke-width="1"/><text x="1374" y="340" font-size="18" fill="#8B9D9E" font-family="Menlo,monospace" font-weight="400">24</text><line x1="180" y1="1360" x2="1380" y2="1360" stroke="#263B49" stroke-width="1"/><text x="135" y="1366" font-size="18" fill="#8B9D9E" font-family="Menlo,monospace" font-weight="400">0</text><line x1="180" y1="1160" x2="1380" y2="1160" stroke="#263B49" stroke-width="1"/><text x="135" y="1166" font-size="18" fill="#8B9D9E" font-family="Menlo,monospace" font-weight="400">4</text><line x1="180" y1="960" x2="1380" y2="960" stroke="#263B49" stroke-width="1"/><text x="135" y="966" font-size="18" fill="#8B9D9E" font-family="Menlo,monospace" font-weight="400">8</text><line x1="180" y1="760" x2="1380" y2="760" stroke="#263B49" stroke-width="1"/><text x="135" y="766" font-size="18" fill="#8B9D9E" font-family="Menlo,monospace" font-weight="400">12</text><line x1="180" y1="560" x2="1380" y2="560" stroke="#263B49" stroke-width="1"/><text x="135" y="566" font-size="18" fill="#8B9D9E" font-family="Menlo,monospace" font-weight="400">16</text><line x1="180" y1="360" x2="1380" y2="360" stroke="#263B49" stroke-width="1"/><text x="135" y="366" font-size="18" fill="#8B9D9E" font-family="Menlo,monospace" font-weight="400">20</text><rect x="430" y="560" width="700" height="600" fill="#23393C"/><text x="480" y="910" font-size="30" fill="#D0EF75" font-family="Avenir Next Condensed,Arial" font-weight="800">14 × 12 m CLEAR FLOOR</text><rect x="230" y="1085.0" width="100" height="75.0" fill="#6E5741"/><rect x="1230" y="1085.0" width="100" height="75.0" fill="#6E5741"/><rect x="230" y="885.0" width="100" height="75.0" fill="#6E5741"/><rect x="1230" y="885.0" width="100" height="75.0" fill="#6E5741"/><rect x="230" y="685.0" width="100" height="75.0" fill="#6E5741"/><rect x="1230" y="685.0" width="100" height="75.0" fill="#6E5741"/><rect x="230" y="485.0" width="100" height="75.0" fill="#6E5741"/><rect x="1230" y="485.0" width="100" height="75.0" fill="#6E5741"/><rect x="761.25" y="485.0" width="37.5" height="25.0" fill="#948067"/><text x="580" y="460" font-size="24" fill="#D9E1CF" font-family="Menlo,monospace" font-weight="400">lectern / professor</text><rect x="580" y="375.0" width="400" height="10.0" fill="#526657"/><line x1="720.0" y1="1360" x2="840.0" y2="1360" stroke="#090E14" stroke-width="10"/><line x1="780" y1="1460" x2="780" y2="1360" stroke="#D0EF75" stroke-width="5"/><text x="580" y="1505" font-size="24" fill="#D0EF75" font-family="Menlo,monospace" font-weight="400">2.4 m shared entry</text><text x="180" y="290" font-size="20" fill="#8B9D9E" font-family="Menlo,monospace" font-weight="400">PROPOSED Z ↑</text><text x="900" y="290" font-size="20" fill="#8B9D9E" font-family="Menlo,monospace" font-weight="400">X → / 0–24 m</text><text x="1520" y="360" font-size="38" fill="#D9E1CF" font-family="Avenir Next Condensed,Arial" font-weight="800">ASSEMBLY + COMBAT BINDINGS</text><text x="1520" y="430" font-size="25" fill="#D9E1CF" font-family="Menlo,monospace" font-weight="400">Flat floor; no raised dais or steps.</text><text x="1520" y="488" font-size="25" fill="#D9E1CF" font-family="Menlo,monospace" font-weight="400">Furniture stays in perimeter strips.</text><text x="1520" y="546" font-size="25" fill="#D9E1CF" font-family="Menlo,monospace" font-weight="400">Ceiling clearance proposal: 4 m.</text><text x="1520" y="604" font-size="25" fill="#D9E1CF" font-family="Menlo,monospace" font-weight="400">Ring radius is gameplay-owned.</text><text x="1520" y="662" font-size="25" fill="#D9E1CF" font-family="Menlo,monospace" font-weight="400">3 slow paper sheets in Barrage.</text><text x="1520" y="720" font-size="25" fill="#D9E1CF" font-family="Menlo,monospace" font-weight="400">Slam: 0.8 s warning before hit.</text><text x="1520" y="778" font-size="25" fill="#D9E1CF" font-family="Menlo,monospace" font-weight="400">A: standard boss.</text><text x="1520" y="836" font-size="25" fill="#D9E1CF" font-family="Menlo,monospace" font-weight="400">B: 2 melee adds once at 50% HP.</text><text x="1520" y="894" font-size="25" fill="#D9E1CF" font-family="Menlo,monospace" font-weight="400">C + POWER OFF: starts at 85% HP.</text><text x="1520" y="952" font-size="25" fill="#D9E1CF" font-family="Menlo,monospace" font-weight="400">Guilt is decorative wall shadow.</text><text x="64" y="1560" font-size="22" fill="#8B9D9E" font-family="Menlo,monospace" font-weight="400">Proposed dimensions, not a final arena balance. Place ring/projectile visuals only after hit geometry is implemented.</text><rect x="0" y="1640" width="2400" height="210" fill="#121c24"/><text x="64" y="1692" fill="#d0ef75" font-size="28" font-family="monospace">GAMEPLAY UPDATE / COMPANION PLAN</text><text x="64" y="1740" fill="#d9e1cf" font-size="23" font-family="monospace">Add charges at proposed X/Z (4,8) and (20,8), with clear riding lanes inside the solid entry seal.</text><a href="../../gameplay-mocks-v2/sheets/boss-recovery-plan.svg"><text x="64" y="1792" fill="#ba86ea" font-size="23" font-family="monospace">Open editable boss-recovery-plan.svg → (also in the gameplay gallery)</text></a><rect x="366" y="940" width="28" height="40" fill="#d0ef75"/><text x="336" y="1018" font-size="23" fill="#d0ef75" font-family="monospace">B1 +25</text><rect x="1166" y="940" width="28" height="40" fill="#d0ef75"/><text x="1136" y="1018" font-size="23" fill="#d0ef75" font-family="monospace">B2 +25</text><line x1="720" y1="1360" x2="840" y2="1360" stroke="#ef624a" stroke-width="14"/><text x="580" y="1540" fill="#ef624a" font-size="22" font-family="monospace">Solid seal closes on arena entry</text></svg>