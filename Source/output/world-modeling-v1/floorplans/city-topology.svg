<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="2400" height="2290" viewBox="0 0 2400 2290"><title>MARIBOR / ROUTE FLOORPLAN</title><rect x="0" y="0" width="2400" height="2080" fill="#090E14"/><text x="64" y="65" font-size="20" fill="#D0EF75" font-family="Menlo,monospace" font-weight="400">BOKI / ENTIRE-WORLD MODELING HANDOFF V1</text><text x="64" y="150" font-size="74" fill="#D9E1CF" font-family="Avenir Next Condensed,Arial" font-weight="800">MARIBOR / ROUTE FLOORPLAN</text><text x="64" y="205" font-size="22" fill="#8B9D9E" font-family="Menlo,monospace" font-weight="400">SCHEMATIC / not meter-scaled · route centerlines + beat markers · vertical position indicates progression</text><path d="M 800 330 L 800 460" fill="none" stroke="#2A3B46" stroke-width="100" stroke-linecap="round" stroke-linejoin="round"/><path d="M 800 460 L 300 460 L 300 680 L 210 870 L 370 1080 L 300 1260 L 800 1450" fill="none" stroke="#2A3B46" stroke-width="100" stroke-linecap="round" stroke-linejoin="round"/><path d="M 800 460 L 800 700 L 900 900 L 710 1100 L 800 1450" fill="none" stroke="#2A3B46" stroke-width="100" stroke-linecap="round" stroke-linejoin="round"/><path d="M 800 460 L 1330 460 L 1330 790 L 1510 790 L 1510 1260 L 800 1450" fill="none" stroke="#2A3B46" stroke-width="100" stroke-linecap="round" stroke-linejoin="round"/><path d="M 800 460 L 300 460 L 300 680 L 210 870 L 370 1080 L 300 1260 L 800 1450" fill="none" stroke="#D0EF75" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M 800 460 L 800 700 L 900 900 L 710 1100 L 800 1450" fill="none" stroke="#628D9F" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M 800 460 L 1330 460 L 1330 790 L 1510 790 L 1510 1260 L 800 1450" fill="none" stroke="#BA86EA" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M 1330 790 L 1330 1050" fill="none" stroke="#2A3B46" stroke-width="100" stroke-linecap="round" stroke-linejoin="round"/><path d="M 1330 790 L 1330 1050" fill="none" stroke="#BA86EA" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="12 12"/><circle cx="1330" cy="1050" r="22" fill="#EF624A"/><text x="1225" y="1135" font-size="26" fill="#EF624A" font-family="Avenir Next Condensed,Arial" font-weight="800">GUILT</text><text x="1370" y="995" font-size="20" fill="#BA86EA" font-family="Menlo,monospace" font-weight="400">RETREAT</text><text x="1170" y="1175" font-size="18" fill="#8B9D9E" font-family="Menlo,monospace" font-weight="400">spur, not a new route</text><rect x="520" y="245" width="750" height="90" fill="#121C24"/><text x="540" y="300" font-size="30" fill="#D0EF75" font-family="Avenir Next Condensed,Arial" font-weight="800">Shared city arrival / filtered gates</text><rect x="570" y="1405" width="460" height="90" fill="#121C24"/><text x="590" y="1460" font-size="30" fill="#D0EF75" font-family="Avenir Next Condensed,Arial" font-weight="800">SHARED END</text><text x="440" y="1555" font-size="27" fill="#D9E1CF" font-family="Avenir Next Condensed,Arial" font-weight="800">FERI sign / ExitCity → FERI</text><rect x="155" y="520" width="290" height="85" fill="#121C24"/><text x="180" y="557" font-size="22" fill="#D0EF75" font-family="Menlo,monospace" font-weight="400">C_A</text><text x="180" y="590" font-size="22" fill="#D9E1CF" font-family="Avenir Next Condensed,Arial" font-weight="800">Tabor</text><rect x="655" y="520" width="290" height="85" fill="#121C24"/><text x="680" y="557" font-size="22" fill="#628D9F" font-family="Menlo,monospace" font-weight="400">C_B</text><text x="680" y="590" font-size="22" fill="#D9E1CF" font-family="Avenir Next Condensed,Arial" font-weight="800">Lent</text><rect x="1185" y="520" width="290" height="85" fill="#121C24"/><text x="1210" y="557" font-size="22" fill="#BA86EA" font-family="Menlo,monospace" font-weight="400">C_C*</text><text x="1210" y="590" font-size="22" fill="#D9E1CF" font-family="Avenir Next Condensed,Arial" font-weight="800">Podzemni prehod</text><circle cx="300" cy="680" r="25" fill="#D0EF75"/><text x="283" y="687" font-size="19" fill="#090E14" font-family="Menlo,monospace" font-weight="400">A1</text><circle cx="210" cy="870" r="25" fill="#D0EF75"/><text x="193" y="877" font-size="19" fill="#090E14" font-family="Menlo,monospace" font-weight="400">A2</text><circle cx="370" cy="1080" r="25" fill="#D0EF75"/><text x="353" y="1087" font-size="19" fill="#090E14" font-family="Menlo,monospace" font-weight="400">A3</text><circle cx="800" cy="700" r="25" fill="#628D9F"/><text x="783" y="707" font-size="19" fill="#090E14" font-family="Menlo,monospace" font-weight="400">B1</text><circle cx="900" cy="900" r="25" fill="#628D9F"/><text x="883" y="907" font-size="19" fill="#090E14" font-family="Menlo,monospace" font-weight="400">B2</text><circle cx="710" cy="1100" r="25" fill="#628D9F"/><text x="693" y="1107" font-size="19" fill="#090E14" font-family="Menlo,monospace" font-weight="400">B3</text><circle cx="1330" cy="680" r="25" fill="#BA86EA"/><text x="1313" y="687" font-size="19" fill="#090E14" font-family="Menlo,monospace" font-weight="400">C1</text><circle cx="1330" cy="1050" r="25" fill="#BA86EA"/><text x="1313" y="1057" font-size="19" fill="#090E14" font-family="Menlo,monospace" font-weight="400">C2</text><circle cx="1510" cy="1000" r="25" fill="#BA86EA"/><text x="1493" y="1007" font-size="19" fill="#090E14" font-family="Menlo,monospace" font-weight="400">C3</text><text x="100" y="1345" font-size="18" fill="#8B9D9E" font-family="Menlo,monospace" font-weight="400">A / more open combat</text><text x="650" y="1345" font-size="18" fill="#8B9D9E" font-family="Menlo,monospace" font-weight="400">B / movement or ranged</text><text x="1120" y="1345" font-size="18" fill="#8B9D9E" font-family="Menlo,monospace" font-weight="400">C / short secret variant</text><text x="1670" y="280" font-size="34" fill="#D0EF75" font-family="Avenir Next Condensed,Arial" font-weight="800">A / Tabor</text><text x="1670" y="335" font-size="22" fill="#D9E1CF" font-family="Menlo,monospace" font-weight="400">A1 · car slalom</text><text x="1670" y="381" font-size="22" fill="#D9E1CF" font-family="Menlo,monospace" font-weight="400">A2 · melee group 1 + car ramp</text><text x="1670" y="427" font-size="22" fill="#D9E1CF" font-family="Menlo,monospace" font-weight="400">A3 · melee group 2 / Guilt roof</text><text x="1670" y="511" font-size="34" fill="#628D9F" font-family="Avenir Next Condensed,Arial" font-weight="800">B / Lent</text><text x="1670" y="566" font-size="22" fill="#D9E1CF" font-family="Menlo,monospace" font-weight="400">B1 · riverbank lane 1</text><text x="1670" y="612" font-size="22" fill="#D9E1CF" font-family="Menlo,monospace" font-weight="400">B2 · Watcher dodge + lamp</text><text x="1670" y="658" font-size="22" fill="#D9E1CF" font-family="Menlo,monospace" font-weight="400">B3 · riverbank lane 2</text><text x="1670" y="742" font-size="34" fill="#BA86EA" font-family="Avenir Next Condensed,Arial" font-weight="800">C / Podzemni prehod</text><text x="1670" y="797" font-size="22" fill="#D9E1CF" font-family="Menlo,monospace" font-weight="400">C1 · closing entry door</text><text x="1670" y="843" font-size="22" fill="#D9E1CF" font-family="Menlo,monospace" font-weight="400">C2 · Guilt reveal / retreat spur</text><text x="1670" y="889" font-size="22" fill="#D9E1CF" font-family="Menlo,monospace" font-weight="400">C3 · side escape → shared end</text><text x="1670" y="973" font-size="21" fill="#8B9D9E" font-family="Menlo,monospace" font-weight="400">Colored lanes show identity only; access is</text><text x="1670" y="1005" font-size="21" fill="#8B9D9E" font-family="Menlo,monospace" font-weight="400">filtered by the run snapshot.</text><text x="1670" y="1055" font-size="21" fill="#8B9D9E" font-family="Menlo,monospace" font-weight="400">Markers are proposed set-piece locations, not</text><text x="1670" y="1087" font-size="21" fill="#8B9D9E" font-family="Menlo,monospace" font-weight="400">fixed spawn quantities.</text><text x="1670" y="1137" font-size="21" fill="#8B9D9E" font-family="Menlo,monospace" font-weight="400">Use simple high banks/walls to prevent route</text><text x="1670" y="1169" font-size="21" fill="#8B9D9E" font-family="Menlo,monospace" font-weight="400">bypass; short rail art alone is not a secure lock.</text><text x="420" y="1660" font-size="22" fill="#8B9D9E" font-family="Menlo,monospace" font-weight="400">Transition is one-way in this run.</text><text x="280" y="1710" font-size="22" fill="#8B9D9E" font-family="Menlo,monospace" font-weight="400">Carry health, battery, upgrades and route choice.</text><text x="64" y="1910" font-size="24" fill="#D0EF75" font-family="Menlo,monospace" font-weight="400">12 regular enemies max · exit persists City C next run · watch transition toward 07:59</text><text x="64" y="1970" font-size="22" fill="#8B9D9E" font-family="Menlo,monospace" font-weight="400">C requires its saved unlock at run start. Current-run discoveries do not open gates. No cross-branch shortcuts.</text><text x="64" y="2025" font-size="21" fill="#8B9D9E" font-family="Menlo,monospace" font-weight="400">Canonical rules: docs/Gameplay.md §§2–4. Build to tested module sizes; do not measure these topology-unit paths.</text><rect x="0" y="2080" width="2400" height="210" fill="#121c24"/><text x="64" y="2132" fill="#d0ef75" font-size="28" font-family="monospace">GAMEPLAY UPDATE / COMPANION PLAN</text><text x="64" y="2180" fill="#d9e1cf" font-size="23" font-family="monospace">Combat exit has no kill quota. The authored City C retreat and side-door escape remain mandatory.</text><a href="../../gameplay-mocks-v2/sheets/city-combat-plan.svg"><text x="64" y="2232" fill="#ba86ea" font-size="23" font-family="monospace">Open editable city-combat-plan.svg → (also in the gameplay gallery)</text></a></svg>