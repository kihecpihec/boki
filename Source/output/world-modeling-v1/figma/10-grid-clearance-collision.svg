<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="2400" height="1920" viewBox="0 0 2400 1920"><title>Shared grid and collision construction proposals</title><rect x="0" y="0" width="2400" height="1920" fill="#090E14"/><text x="64" y="65" font-size="20" fill="#D0EF75" font-family="Menlo,monospace" font-weight="400">BOKI / ENTIRE-WORLD MODELING HANDOFF V1</text><text x="64" y="150" font-size="74" fill="#D9E1CF" font-family="Avenir Next Condensed,Arial" font-weight="800">BUILD THE COLLISION BEFORE THE DRESSING</text><text x="64" y="205" font-size="22" fill="#8B9D9E" font-family="Menlo,monospace" font-weight="400">METER-SCALED DETAILS / 4 m bay · 3 m corridor · 3.5 m headroom · 0.5 m rise over 4 m run</text><text x="64" y="300" font-size="36" fill="#D9E1CF" font-family="Avenir Next Condensed,Arial" font-weight="800">01 / 4 m BAY / PLAN</text><rect x="160" y="400" width="480" height="480" fill="#263B49" stroke="#D9E1CF" stroke-width="3"/><rect x="220" y="460" width="360" height="360" fill="#121C24" stroke="#D0EF75" stroke-width="3"/><text x="165" y="940" font-size="23" fill="#D9E1CF" font-family="Menlo,monospace" font-weight="400">4 m outer bay</text><text x="195" y="700" font-size="24" fill="#D0EF75" font-family="Menlo,monospace" font-weight="400">3 m clear interior</text><text x="80" y="985" font-size="22" fill="#8B9D9E" font-family="Menlo,monospace" font-weight="400">walls + structural margins</text><text x="75" y="905" font-size="19" fill="#BA86EA" font-family="Menlo,monospace" font-weight="400">origin</text><circle cx="160" cy="880" r="10" fill="#BA86EA"/><text x="800" y="300" font-size="36" fill="#D9E1CF" font-family="Avenir Next Condensed,Arial" font-weight="800">02 / CORRIDOR SECTION</text><rect x="870" y="400" width="360" height="420" fill="#121C24" stroke="#D9E1CF" stroke-width="3"/><rect x="870" y="820" width="360" height="24" fill="#526572"/><rect x="1008" y="604" width="84" height="216" rx="42" fill="none" stroke="#D0EF75" stroke-width="5"/><text x="790" y="915" font-size="24" fill="#D9E1CF" font-family="Menlo,monospace" font-weight="400">3.5 m clear height</text><text x="790" y="960" font-size="22" fill="#D0EF75" font-family="Menlo,monospace" font-weight="400">standing capsule 1.8 × 0.7 m</text><text x="790" y="1005" font-size="20" fill="#8B9D9E" font-family="Menlo,monospace" font-weight="400">Jump + follow-camera clearance needs a live test.</text><text x="1560" y="300" font-size="36" fill="#D9E1CF" font-family="Avenir Next Condensed,Arial" font-weight="800">03 / RAMP SECTION</text><path d="M 1640 820 L 2120 760 L 2120 850 L 1640 850 Z" fill="#526572" stroke="#D9E1CF" stroke-width="3"/><text x="1610" y="920" font-size="25" fill="#D0EF75" font-family="Menlo,monospace" font-weight="400">4 m run / 0.5 m rise</text><text x="1610" y="965" font-size="22" fill="#D9E1CF" font-family="Menlo,monospace" font-weight="400">continuous ride surface</text><text x="1610" y="1005" font-size="21" fill="#8B9D9E" font-family="Menlo,monospace" font-weight="400">No seam lip at either end.</text><text x="64" y="1140" font-size="36" fill="#D9E1CF" font-family="Avenir Next Condensed,Arial" font-weight="800">04 / GATE / TOP VIEW</text><rect x="100" y="1220" width="60" height="300" fill="#526572"/><rect x="520" y="1220" width="60" height="300" fill="#526572"/><rect x="160" y="1270" width="360" height="30" fill="#EF624A"/><rect x="160" y="1390" width="360" height="180" fill="#1B3B28" stroke="#D0EF75" stroke-width="3"/><text x="100" y="1630" font-size="23" fill="#EF624A" font-family="Menlo,monospace" font-weight="400">BLOCKER / not a trigger</text><text x="100" y="1680" font-size="22" fill="#D0EF75" font-family="Menlo,monospace" font-weight="400">SELECTION TRIGGER beyond leaf</text><line x1="760" y1="1240" x2="760" y2="1490" stroke="#D0EF75" stroke-width="4"/><text x="665" y="1220" font-size="22" fill="#D0EF75" font-family="Menlo,monospace" font-weight="400">travel</text><path d="M 746 1470 L 774 1470 L 760 1495 Z" fill="#D0EF75"/><text x="900" y="1140" font-size="36" fill="#D9E1CF" font-family="Avenir Next Condensed,Arial" font-weight="800">05 / HEIGHT-AWARE SNAPS</text><text x="900" y="1220" font-size="25" fill="#D9E1CF" font-family="Menlo,monospace" font-weight="400">Flat bay: Snap_S (2,0,0); Snap_N (2,0,4).</text><text x="900" y="1282" font-size="25" fill="#D9E1CF" font-family="Menlo,monospace" font-weight="400">Ramp north end: Snap_N (2,0.5,4).</text><text x="900" y="1344" font-size="25" fill="#D9E1CF" font-family="Menlo,monospace" font-weight="400">Clear floor Y is consistent at joins.</text><text x="900" y="1406" font-size="25" fill="#D9E1CF" font-family="Menlo,monospace" font-weight="400">Static art does not carry gameplay scripts.</text><text x="900" y="1468" font-size="25" fill="#D9E1CF" font-family="Menlo,monospace" font-weight="400">Short fence/rail art may be jumpable; it is not a certified route barrier.</text><text x="64" y="1810" font-size="24" fill="#D0EF75" font-family="Menlo,monospace" font-weight="400">Lock state owns both blocker and selection sensor. A visible root barrier without collision is not a lock.</text><text x="64" y="1870" font-size="22" fill="#8B9D9E" font-family="Menlo,monospace" font-weight="400">Only these explicit module drawings are meter-scaled. Whole-scene plans are topological and require pacing/camera playtests.</text></svg>