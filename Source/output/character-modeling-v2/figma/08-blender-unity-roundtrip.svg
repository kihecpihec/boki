<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="2400" height="1550" viewBox="0 0 2400 1550"><title>BOKI character modeling handoff</title><rect x="0" y="0" width="2400" height="1550" fill="#090E14"/><text x="64" y="64" fill="#D0EF75" font-size="20" font-family="Menlo,monospace" font-weight="400">BOKI / MODELING HANDOFF V2</text><text x="64" y="150" fill="#D9E1CF" font-size="74" font-family="Avenir Next Condensed,Arial" font-weight="800">BLENDER → UNITY / THE ROUND TRIP</text><text x="64" y="205" fill="#8B9D9E" font-size="23" font-family="Menlo,monospace" font-weight="400">An implementation proposal. Only the existing player envelope was inspected; mesh import is not yet tested.</text><rect x="64" y="300" width="550" height="330" fill="#121C24"/><rect x="64" y="300" width="550" height="6" fill="#D0EF75"/><text x="88" y="365" fill="#D9E1CF" font-size="36" font-family="Avenir Next Condensed,Arial" font-weight="800">01 / BLOCKOUT</text><text x="88" y="420" fill="#8B9D9E" font-size="25" font-family="Menlo,monospace" font-weight="400">1 m calibration cube; +Z forward</text><text x="88" y="458" fill="#8B9D9E" font-size="25" font-family="Menlo,monospace" font-weight="400">in Unity. Match proposed</text><text x="88" y="496" fill="#8B9D9E" font-size="25" font-family="Menlo,monospace" font-weight="400">dimensions and riding contacts.</text><rect x="644" y="300" width="550" height="330" fill="#121C24"/><rect x="644" y="300" width="550" height="6" fill="#D0EF75"/><text x="668" y="365" fill="#D9E1CF" font-size="36" font-family="Avenir Next Condensed,Arial" font-weight="800">02 / SHAPE + UV</text><text x="668" y="420" fill="#8B9D9E" font-size="25" font-family="Menlo,monospace" font-weight="400">Model silhouette, remove hidden</text><text x="668" y="458" fill="#8B9D9E" font-size="25" font-family="Menlo,monospace" font-weight="400">faces, UV with padding; keep</text><text x="668" y="496" fill="#8B9D9E" font-size="25" font-family="Menlo,monospace" font-weight="400">small painted atlases.</text><rect x="1224" y="300" width="550" height="330" fill="#121C24"/><rect x="1224" y="300" width="550" height="6" fill="#D0EF75"/><text x="1248" y="365" fill="#D9E1CF" font-size="36" font-family="Avenir Next Condensed,Arial" font-weight="800">03 / RIG + WEIGHTS</text><text x="1248" y="420" fill="#8B9D9E" font-size="25" font-family="Menlo,monospace" font-weight="400">Small Generic deformation rig;</text><text x="1248" y="458" fill="#8B9D9E" font-size="25" font-family="Menlo,monospace" font-weight="400">consistent root, names, rest</text><text x="1248" y="496" fill="#8B9D9E" font-size="25" font-family="Menlo,monospace" font-weight="400">pose and normalized skin</text><text x="1248" y="534" fill="#8B9D9E" font-size="25" font-family="Menlo,monospace" font-weight="400">weights.</text><rect x="1804" y="300" width="550" height="330" fill="#121C24"/><rect x="1804" y="300" width="550" height="6" fill="#D0EF75"/><text x="1828" y="365" fill="#D9E1CF" font-size="36" font-family="Avenir Next Condensed,Arial" font-weight="800">04 / IN-PLACE CLIPS</text><text x="1828" y="420" fill="#8B9D9E" font-size="25" font-family="Menlo,monospace" font-weight="400">No root travel. Code owns jumps,</text><text x="1828" y="458" fill="#8B9D9E" font-size="25" font-family="Menlo,monospace" font-weight="400">projectiles and hits; visual</text><text x="1828" y="496" fill="#8B9D9E" font-size="25" font-family="Menlo,monospace" font-weight="400">clips follow gameplay.</text><rect x="64" y="690" width="550" height="330" fill="#121C24"/><rect x="64" y="690" width="550" height="6" fill="#BA86EA"/><text x="88" y="755" fill="#D9E1CF" font-size="36" font-family="Avenir Next Condensed,Arial" font-weight="800">05 / FBX TEST</text><text x="88" y="810" fill="#8B9D9E" font-size="25" font-family="Menlo,monospace" font-weight="400">Selected mesh + armature; verify</text><text x="88" y="848" fill="#8B9D9E" font-size="25" font-family="Menlo,monospace" font-weight="400">scale/facing/normals in pinned</text><text x="88" y="886" fill="#8B9D9E" font-size="25" font-family="Menlo,monospace" font-weight="400">6000.6.7f1 Editor.</text><rect x="644" y="690" width="550" height="330" fill="#121C24"/><rect x="644" y="690" width="550" height="6" fill="#BA86EA"/><text x="668" y="755" fill="#D9E1CF" font-size="36" font-family="Avenir Next Condensed,Arial" font-weight="800">06 / PLAYER ASSEMBLY</text><text x="668" y="810" fill="#8B9D9E" font-size="25" font-family="Menlo,monospace" font-weight="400">Animator off root motion.</text><text x="668" y="848" fill="#8B9D9E" font-size="25" font-family="Menlo,monospace" font-weight="400">Preserve CharacterController +</text><text x="668" y="886" fill="#8B9D9E" font-size="25" font-family="Menlo,monospace" font-weight="400">CameraPivot; add child</text><text x="668" y="924" fill="#8B9D9E" font-size="25" font-family="Menlo,monospace" font-weight="400">VisualRoot.</text><rect x="1224" y="690" width="550" height="330" fill="#121C24"/><rect x="1224" y="690" width="550" height="6" fill="#BA86EA"/><text x="1248" y="755" fill="#D9E1CF" font-size="36" font-family="Avenir Next Condensed,Arial" font-weight="800">07 / WIRING</text><text x="1248" y="810" fill="#8B9D9E" font-size="25" font-family="Menlo,monospace" font-weight="400">Assign camera + input</text><text x="1248" y="848" fill="#8B9D9E" font-size="25" font-family="Menlo,monospace" font-weight="400">references; future adapters</text><text x="1248" y="886" fill="#8B9D9E" font-size="25" font-family="Menlo,monospace" font-weight="400">connect Animator, muzzle and</text><text x="1248" y="924" fill="#8B9D9E" font-size="25" font-family="Menlo,monospace" font-weight="400">headlight.</text><rect x="1804" y="690" width="550" height="330" fill="#121C24"/><rect x="1804" y="690" width="550" height="6" fill="#BA86EA"/><text x="1828" y="755" fill="#D9E1CF" font-size="36" font-family="Avenir Next Condensed,Arial" font-weight="800">08 / ACCEPTANCE</text><text x="1828" y="810" fill="#8B9D9E" font-size="25" font-family="Menlo,monospace" font-weight="400">Contacts, deformation, camera,</text><text x="1828" y="848" fill="#8B9D9E" font-size="25" font-family="Menlo,monospace" font-weight="400">hit geometry and Windows</text><text x="1828" y="886" fill="#8B9D9E" font-size="25" font-family="Menlo,monospace" font-weight="400">target-hardware performance</text><text x="1828" y="924" fill="#8B9D9E" font-size="25" font-family="Menlo,monospace" font-weight="400">checks.</text><text x="64" y="1150" fill="#D0EF75" font-size="28" font-family="Menlo,monospace" font-weight="400">EXISTING ROOT: CharacterController 1.8 m × radius 0.35 m; CameraPivot Y = 1.4 m.</text><text x="64" y="1210" fill="#D9E1CF" font-size="25" font-family="Menlo,monospace" font-weight="400">NEW MODEL ROOT: keep unit scale; VisualRoot may lean; gameplay root and CameraPivot stay unanimated.</text><text x="64" y="1320" fill="#8B9D9E" font-size="23" font-family="Menlo,monospace" font-weight="400">Figma v2 update is pending: Starter MCP allowance exhausted. Drag SVGs + paired PNGs into Figma manually.</text><text x="64" y="1380" fill="#8B9D9E" font-size="23" font-family="Menlo,monospace" font-weight="400">Read UNITY_HANDOFF.md for the exact current/proposed distinction and the manual validation checklist.</text></svg>