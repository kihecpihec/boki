<!doctype html><html lang="en"><head><meta charset="utf-8"><title>BOKI / Level up screen (UI only)</title>
<!-- UI-only layer: transparent background. The live game state renders underneath. -->
<style>
*{box-sizing:border-box;margin:0}
html,body{background:transparent}
body{font:20px/1.3 "Courier New",Consolas,monospace;color:#e6e2d6}
.screen{position:relative;width:1600px;height:900px;overflow:hidden;background:transparent;transform-origin:0 0}
/* pause dimming: darkens the game, heavier on the right where the offer sits */
.vig{position:absolute;inset:0;background:radial-gradient(ellipse at 40% 50%,#0000 40%,#000a 100%),linear-gradient(90deg,#0000 40%,#000c 78%),linear-gradient(#0006,#0006)}
.red{position:absolute;inset:0;box-shadow:inset 0 0 140px 30px #7a0a0a99}
.scan{position:absolute;inset:0;background:repeating-linear-gradient(0deg,#0000 0 2px,#0004 2px 3px);pointer-events:none}
.pause{position:absolute;left:0;right:0;top:26px;text-align:center;color:#9a8f80;font-size:18px;letter-spacing:.3em;text-shadow:0 0 2px #000,2px 2px 0 #000}
.offer{position:absolute;left:930px;top:150px;width:620px}
.title{font:italic 700 58px/1 Georgia,"Times New Roman",serif;color:#c8bfae;letter-spacing:.04em;text-shadow:3px 0 #8a1010,-3px 0 #1a4a5a99,0 0 22px #0009}
.sub{font-family:Georgia,serif;font-style:italic;color:#8a8070;font-size:22px;margin:6px 0 26px}
.opt{position:relative;padding:16px 22px 16px 62px;margin-bottom:16px;background:#0b0808d9;border:2px solid #3a3030;border-left:6px solid #3a3030}
.opt .n{position:absolute;left:20px;top:14px;font-size:26px;color:#6b6258}
.opt h3{font:700 28px/1.1 Georgia,serif;letter-spacing:.05em;color:#d8d0c0;text-transform:uppercase}
.opt .e{color:#a49a88;font-size:19px;margin-top:6px}
.opt .t{position:absolute;right:16px;top:10px;font-size:13px;color:#6b6258;letter-spacing:.1em}
.opt.sel{border-color:#9b1c1c;border-left-color:#c43030;background:#1a0a0aeb;box-shadow:0 0 28px #8a101055}
.opt.sel::before{content:"▶";position:absolute;left:-34px;top:18px;color:#c43030;font-size:22px;animation:blink 1s steps(2) infinite}
.opt.sel .n{color:#c43030}.opt.sel h3{color:#f0e6d2}
.opt.rec h3{color:#b9c27a}
@keyframes blink{50%{opacity:0}}
.keys{margin-top:22px;color:#6b6258;font-size:16px;letter-spacing:.08em}
.keys b{color:#a49a88;font-weight:400}
</style></head><body>
<div class="screen" id="s">
 <div class="vig"></div><div class="red"></div>
 <div class="pause">— PAUSED —</div>
 <div class="offer">
  <div class="title">Level up</div>
  <div class="sub">Something in the dark noticed. Take one.</div>
  <div class="opt sel"><span class="n">1</span><span class="t">UPGRADE · 1/3</span>
   <h3>Rave Overdrive</h3><div class="e">+30% laser damage &nbsp;(now +30% → +60%)</div></div>
  <div class="opt"><span class="n">2</span><span class="t">UPGRADE · NEW</span>
   <h3>Turbo Skiro</h3><div class="e">+20% movement speed</div></div>
  <div class="opt rec"><span class="n">3</span><span class="t">RECOVERY</span>
   <h3>Emergency Snack</h3><div class="e">Restore 30 HP &nbsp;(80 → 100)</div></div>
  <div class="keys"><b>A / D</b> choose &nbsp; <b>ENTER</b> take &nbsp; <b>1 2 3</b> quick &nbsp; · &nbsp;no skip</div>
 </div>
 <div class="scan"></div>
</div>
<script>
function fit(){var s=document.getElementById('s'),k=Math.min(1,innerWidth/1600);s.style.transform='scale('+k+')';document.body.style.height=900*k+'px';document.body.style.overflow='hidden'}
fit();addEventListener('resize',fit);
</script>
</body></html>
